<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff5f5">
  <title>20/10 - Chiếc Rương Đặc Biệt</title>
  
  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Style Web 1 -->
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="app-card">
    <!-- Header -->
    <header class="header">
      <div class="logo-badge">
        <span class="badge-icon">🎀</span>
        <span class="badge-text">Women'sDay 20/10 💌</span>
      </div>
      <img src="../images/main1/logo1.png" class="header-logo" alt="A2K26 Trung Gia Highschool">
    </header>

    <!-- Main Content -->
    <main class="main-section">
      <div class="title-group">
        <h1 class="main-title">Hộp quà đặc biệt từ A2K26!</h1>
        <p class="subtitle">Điều bất ngờ đang chờ đợi các bạn.</p>
      </div>

      <!-- Chest Area -->
      <div class="chest-stage">
        <!-- Ảnh Cô và tập thể bên góc trái gần rương -->
        <img src="../images/main1/co_ha1.png" class="img_class1" alt="Cô Hà">
        <img src="../images/main1/tapthe_cgai1.png" class="img_class2" alt="Tập thể">

        <!-- Ambient Rays & Sparkles (Tia sáng xung quanh rương) -->
        <div class="chest-rays" aria-hidden="true">
          <span class="ray r1"></span>
          <span class="ray r2"></span>
          <span class="ray r3"></span>
          <span class="ray r4"></span>
          <span class="ray r5"></span>
          <span class="ray r6"></span>
        </div>

        <!-- High-Detail SVG Treasure Chest -->
        <div class="chest-wrapper" id="chest" role="button" tabindex="0" title="Chạm để mở">
          
          <!-- Shadow dưới đáy rương -->
          <div class="chest-ground-shadow"></div>

          <!-- Lớp tia sáng bắn ra từ trong rương khi mở -->
          <div class="chest-light-burst" id="lightBurst" aria-hidden="true">
            <div class="light-beam"></div>
            <div class="magic-sparkles">
              <span class="msp m1">✨</span>
              <span class="msp m2">✦</span>
              <span class="msp m3">★</span>
              <span class="msp m4">✨</span>
              <span class="msp m5">✦</span>
            </div>
          </div>

          <!-- Vector Chest SVG Component -->
          <svg class="chest-svg" viewBox="0 0 280 230" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <!-- Gỗ nắp rương -->
              <linearGradient id="lidWoodGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ea9645"/>
                <stop offset="35%" stop-color="#d47c28"/>
                <stop offset="85%" stop-color="#b85f16"/>
                <stop offset="100%" stop-color="#91450a"/>
              </linearGradient>

              <!-- Ánh sáng nổi trên nắp -->
              <linearGradient id="lidHighlight" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
                <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
                <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
              </linearGradient>

              <!-- Gỗ thân rương -->
              <linearGradient id="bodyWoodGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#c66d1f"/>
                <stop offset="40%" stop-color="#b05711"/>
                <stop offset="100%" stop-color="#7e3705"/>
              </linearGradient>

              <!-- Khoảng không đen sâu thẳm bên trong rương -->
              <radialGradient id="voidGradient" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#2a123f"/>
                <stop offset="45%" stop-color="#140622"/>
                <stop offset="85%" stop-color="#07020d"/>
                <stop offset="100%" stop-color="#000000"/>
              </radialGradient>

              <!-- Kim loại vàng nẹp viền rương -->
              <linearGradient id="goldBandGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#d9911c"/>
                <stop offset="25%" stop-color="#ffd55c"/>
                <stop offset="55%" stop-color="#fff099"/>
                <stop offset="80%" stop-color="#f3a92b"/>
                <stop offset="100%" stop-color="#b6710a"/>
              </linearGradient>

              <!-- Vàng ổ khóa -->
              <linearGradient id="goldLockGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#fff2a1"/>
                <stop offset="40%" stop-color="#fbb034"/>
                <stop offset="100%" stop-color="#c67605"/>
              </linearGradient>

              <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
              </filter>
            </defs>

            <!-- 1. KHOANG BÊN TRONG RƯƠNG (Hiển thị khi nắp mở) -->
            <g id="chestInterior" class="chest-interior-group">
              <!-- Lòng rương màu đen huyền bí -->
              <ellipse cx="140" cy="98" rx="94" ry="24" fill="url(#voidGradient)"/>
              <path d="M 46 98 C 46 122, 234 122, 234 98 L 230 115 C 230 135, 50 135, 50 115 Z" fill="#090312"/>
              <!-- Viền mép gỗ trong -->
              <path d="M 44 98 C 44 80, 236 80, 236 98 C 236 106, 44 106, 44 98 Z" fill="none" stroke="#682c06" stroke-width="3"/>
              <!-- Đốm sao lấp lánh trong khoảng đen -->
              <circle cx="120" cy="94" r="1.5" fill="#ffd700" opacity="0.9"/>
              <circle cx="155" cy="102" r="1.2" fill="#ffffff" opacity="0.8"/>
              <circle cx="95" cy="100" r="1" fill="#ffb6c1" opacity="0.7"/>
              <circle cx="178" cy="95" r="1.4" fill="#ffffff" opacity="0.85"/>
            </g>

            <!-- 2. THÂN RƯƠNG DƯỚI (Chest Base) -->
            <g id="chestBaseGroup" class="chest-base-group">
              <!-- Thùng gỗ chính -->
              <path d="M 42 98 
                       L 238 98 
                       L 230 182 
                       Q 230 192, 218 192 
                       L 62 192 
                       Q 50 192, 50 182 
                       Z" 
                    fill="url(#bodyWoodGrad)" 
                    stroke="#5e2604" 
                    stroke-width="3.5" 
                    stroke-linejoin="round"/>

              <!-- Đường vân gỗ ngang -->
              <path d="M 47 132 Q 140 136, 233 132" fill="none" stroke="#501e02" stroke-width="2.5" opacity="0.7"/>
              <path d="M 49 162 Q 140 166, 231 162" fill="none" stroke="#501e02" stroke-width="2.5" opacity="0.7"/>

              <!-- Viền miệng thùng rương (Gờ gỗ trên cùng) -->
              <path d="M 39 96 L 241 96 L 239 104 L 41 104 Z" fill="#753005" stroke="#501e02" stroke-width="2"/>

              <!-- Nẹp kim loại dọc - Trái -->
              <g class="metal-band">
                <path d="M 72 98 L 90 98 L 88 192 L 70 192 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="2"/>
                <!-- Đinh tán (Rivets) -->
                <circle cx="81" cy="115" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
                <circle cx="80" cy="147" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
                <circle cx="79" cy="178" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
              </g>

              <!-- Nẹp kim loại dọc - Giữa -->
              <g class="metal-band">
                <path d="M 129 98 L 151 98 L 151 192 L 129 192 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="2"/>
                <circle cx="140" cy="178" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
              </g>

              <!-- Nẹp kim loại dọc - Phải -->
              <g class="metal-band">
                <path d="M 190 98 L 208 98 L 210 192 L 192 192 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="2"/>
                <circle cx="199" cy="115" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
                <circle cx="200" cy="147" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
                <circle cx="201" cy="178" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
              </g>

              <!-- Miếng bọc góc kim loại đáy trái & phải -->
              <path d="M 50 174 L 66 174 L 66 192 L 62 192 Q 50 192, 50 182 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="1.5"/>
              <path d="M 230 174 L 214 174 L 214 192 L 218 192 Q 230 192, 230 182 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="1.5"/>

              <!-- Tấm đế khóa vàng (Lock Backplate) -->
              <rect x="127" y="104" width="26" height="34" rx="5" fill="url(#goldLockGrad)" stroke="#5e2604" stroke-width="2.2"/>
              <!-- Lỗ khóa cổ điển -->
              <circle cx="140" cy="116" r="3.2" fill="#2d1302"/>
              <path d="M 138.2 117 L 141.8 117 L 142.8 127 L 137.2 127 Z" fill="#2d1302"/>
            </g>

            <!-- 3. NẮP RƯƠNG (Chest Lid - Sẽ bật mở mượt mà) -->
            <g id="chestLidGroup" class="chest-lid-group">
              <!-- Khối vòm gỗ nắp rương -->
              <path d="M 36 98 
                       C 36 50, 72 38, 140 38 
                       C 208 38, 244 50, 244 98 
                       Z" 
                    fill="url(#lidWoodGrad)" 
                    stroke="#5e2604" 
                    stroke-width="3.5" 
                    stroke-linejoin="round"/>

              <!-- Lớp ánh sáng nổi khối (Specular highlight) -->
              <path d="M 44 94 
                       C 44 58, 76 44, 140 44 
                       C 204 44, 236 58, 236 94 
                       Z" 
                    fill="url(#lidHighlight)"/>

              <!-- Đường vân vòm nắp rương -->
              <path d="M 38 78 C 70 60, 210 60, 242 78" fill="none" stroke="#7e3807" stroke-width="2" opacity="0.5"/>
              <path d="M 42 60 C 80 48, 200 48, 238 60" fill="none" stroke="#7e3807" stroke-width="1.8" opacity="0.4"/>

              <!-- Nẹp kim loại vòm - Trái -->
              <g class="metal-band">
                <path d="M 72 98 C 72 64, 82 46, 90 42 L 102 44 C 94 50, 86 66, 88 98 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="2"/>
                <circle cx="83" cy="85" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
                <circle cx="88" cy="58" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
              </g>

              <!-- Nẹp kim loại vòm - Giữa -->
              <g class="metal-band">
                <path d="M 129 98 C 129 55, 131 40, 140 38 C 149 40, 151 55, 151 98 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="2"/>
                <circle cx="140" cy="56" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
                <circle cx="140" cy="82" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
              </g>

              <!-- Nẹp kim loại vòm - Phải -->
              <g class="metal-band">
                <path d="M 208 98 C 208 64, 198 46, 190 42 L 178 44 C 186 50, 194 66, 192 98 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="2"/>
                <circle cx="197" cy="85" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
                <circle cx="192" cy="58" r="2.8" fill="#ffeaa7" stroke="#683404" stroke-width="1.2"/>
              </g>

              <!-- Dải gờ viền mép dưới nắp rương -->
              <path d="M 34 94 L 246 94 L 246 102 L 34 102 Z" fill="url(#goldBandGrad)" stroke="#5e2604" stroke-width="2.2" rx="2"/>
              <circle cx="50" cy="98" r="2.4" fill="#ffeaa7" stroke="#683404" stroke-width="1"/>
              <circle cx="230" cy="98" r="2.4" fill="#ffeaa7" stroke="#683404" stroke-width="1"/>

              <!-- Chốt ngàm khóa trên nắp rương (Hasp Clasp) -->
              <g id="lidClasp" class="lid-clasp">
                <path d="M 132 94 L 148 94 L 145 110 L 135 110 Z" fill="url(#goldLockGrad)" stroke="#5e2604" stroke-width="1.8"/>
                <circle cx="140" cy="98" r="2" fill="#ffeaa7"/>
              </g>
            </g>

            <!-- 4. Ổ KHÓA TREO PHÍA TRƯỚC (Sẽ rung lắc và xoay 360° khi tap) -->
            <g id="chestLockNode" class="chest-lock-node">
              <!-- Vòng móc khóa -->
              <path d="M 134 106 C 134 98, 146 98, 146 106" fill="none" stroke="#d48a12" stroke-width="3" stroke-linecap="round"/>
              <!-- Thân ổ khóa vàng bóng -->
              <rect x="130" y="104" width="20" height="22" rx="4" fill="url(#goldLockGrad)" stroke="#5e2604" stroke-width="2" filter="url(#softGlow)"/>
              <!-- Lỗ khóa ổ treo -->
              <circle cx="140" cy="113" r="2.4" fill="#2d1302"/>
              <path d="M 138.8 114 L 141.2 114 L 141.8 121 L 138.2 121 Z" fill="#2d1302"/>
            </g>
          </svg>
        </div>
      </div>

      <!-- Key Pill Counter -->
      <div class="key-pill" id="keyPill">
        <span class="key-pill-icon">🔑</span>
        <span class="key-pill-text">Hiện có: <strong id="keyCount" class="key-number">0</strong> khóa</span>
      </div>

      <!-- Action Button & Hint -->
      <div class="action-wrap">
        <button type="button" class="btn-open" id="openBtn">
          <span class="btn-icon">🎁</span>
          <span>Mở rương</span>
        </button>
      </div>
    </main>

    <!-- Bottom Wave Background -->
    <div class="bottom-wave" aria-hidden="true">
      <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
        <path fill="#ffe8ee" fill-opacity="0.65" d="M0,64L80,85.3C160,107,320,149,480,154.7C640,160,800,128,960,117.3C1120,107,1280,117,1360,122.7L1440,128L1440,220L1360,220C1280,220,1120,220,960,220C800,220,640,220,480,220C320,220,160,220,80,220L0,220Z"></path>
      </svg>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Cảm ơn tất cả mọi người đã tham gia! <span class="footer-heart">❤️</span></span>
    </footer>
  </div>

  <!-- Fullscreen Zoom Portal Overlay (Zoom vào khoảng đen chuyển hướng) -->
  <div class="portal-overlay" id="portalOverlay">
    <div class="portal-stars">
      <span class="pstar p1">✦</span>
      <span class="pstar p2">✨</span>
      <span class="pstar p3">✦</span>
      <span class="pstar p4">✨</span>
      <span class="pstar p5">✦</span>
    </div>
    <div class="portal-text">Đang khám phá bí mật... ✨</div>
  </div>

  <!-- Flying Key Container -->
  <div id="flyKeyLayer" class="fly-key-layer"></div>

  <!-- Script Web 1 -->
  <script src="main.js?v=3"></script>
</body>
</html>
