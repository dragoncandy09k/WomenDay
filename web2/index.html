<body class="body-letter">
  <p class="thank-line">Cảm ơn bạn vì đã tham gia 💌</p>

  <!-- Chi giu phong bi + mo thiep -->
  <div id="castle">
    <div class="letter">
      <div class="valentines">
        <div class="envelope"></div>
        <div class="front"></div>
        <div class="card">
          <div class="text">Happy Vietnamese<br>Women's Day!</div>
          <div class="nameClass">A2K26</div>
          <div class="heart"></div>
        </div>
        <div class="hearts" aria-hidden="true">
          <span class="h h1"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.11C.6 10.2 1.7 6.5 5 5c2-.9 4.2-.4 5.5 1L12 7.5l1.5-1.5C14.8 4.6 17 4.1 19 5c3.3 1.5 4.4 5.2 2.33 7.89C18.7 16.65 12 21 12 21z" fill="#e63946"/></svg></span>
          <span class="h h2"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.11C.6 10.2 1.7 6.5 5 5c2-.9 4.2-.4 5.5 1L12 7.5l1.5-1.5C14.8 4.6 17 4.1 19 5c3.3 1.5 4.4 5.2 2.33 7.89C18.7 16.65 12 21 12 21z" fill="#ff5d8f"/></svg></span>
          <span class="h h3"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.11C.6 10.2 1.7 6.5 5 5c2-.9 4.2-.4 5.5 1L12 7.5l1.5-1.5C14.8 4.6 17 4.1 19 5c3.3 1.5 4.4 5.2 2.33 7.89C18.7 16.65 12 21 12 21z" fill="#d62828"/></svg></span>
          <span class="h h4"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.11C.6 10.2 1.7 6.5 5 5c2-.9 4.2-.4 5.5 1L12 7.5l1.5-1.5C14.8 4.6 17 4.1 19 5c3.3 1.5 4.4 5.2 2.33 7.89C18.7 16.65 12 21 12 21z" fill="#ff8fa3"/></svg></span>
          <span class="h h5"><svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.33-8.11C.6 10.2 1.7 6.5 5 5c2-.9 4.2-.4 5.5 1L12 7.5l1.5-1.5C14.8 4.6 17 4.1 19 5c3.3 1.5 4.4 5.2 2.33 7.89C18.7 16.65 12 21 12 21z" fill="#c9184a"/></svg></span>
        </div>
      </div>
      <div class="shadow"></div>
    </div>
  </div>

  <div class="wrapperLetterForm">
    <div class="boxLetter">
      <span class="fa-xmark" id="close-letter">x</span>
      <div class="formLetter">
        <div class="wrapperLetter">
          <div class="photoFrame"><img id="letter-photo" alt="Anh"></div>
          <div class="textLetter">
            <div id="letter-title"></div>
            <p class="contentLetter" id="letter-content"></p>
          </div>
        </div>
      </div>
      <div class="before"></div>
    </div>
  </div>

  <script src="data.js?v=3"></script>
  <script src="main.js?v=6"></script>
